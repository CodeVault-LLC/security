# CodeVault continuous integration.
#
# The gates run in the order a contributor would want them to fail: lint and
# formatting first because they are instant, then types, then tests, then the
# build. Integration tests run against a real PostgreSQL, because the access
# control this product depends on is partly SQL and a mocked database would
# prove nothing about it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bunx vitest --run --project node --project dom

      - name: Build
        run: bun run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codevault
          POSTGRES_PASSWORD: codevault_ci
          POSTGRES_DB: codevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codevault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://codevault:codevault_ci@127.0.0.1:5432/codevault

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      - name: Integration tests
        run: bunx vitest --run --project node-integration

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # A known-vulnerable dependency in a security tool is not an irony worth
      # shipping. Advisories fail the build; the fix is an upgrade, not a
      # suppression file.
      - name: Audit
        run: bun audit --audit-level=moderate

  package:
    name: Package (${{ matrix.os }})
    # Packaging runs on tags only: each platform must be built and signed on its
    # own runner, and doing that on every push wastes an hour per commit.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, integration]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Package
        working-directory: apps/desktop
        env:
          # Signing and notarisation are skipped when these are absent, which is
          # what a fork's CI does. They are never committed.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bunx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: codevault-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.rpm
            apps/desktop/release/*.AppImage
          if-no-files-found: ignore
