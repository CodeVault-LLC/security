# CodeVault continuous integration.
#
# The gates run in the order a contributor would want them to fail: lint and
# formatting first because they are instant, then types, then tests, then the
# build. Integration tests run against a real PostgreSQL, because the access
# control this product depends on is partly SQL and a mocked database would
# prove nothing about it.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bunx vitest --run --project node --project dom

      - name: Build
        run: bun run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: codevault
          POSTGRES_PASSWORD: codevault_ci
          POSTGRES_DB: codevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codevault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://codevault:codevault_ci@127.0.0.1:5432/codevault

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      - name: Integration tests
        run: bunx vitest --run --project node-integration

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # A known-vulnerable dependency in a security tool is not an irony worth
      # shipping. Advisories fail the build; the fix is an upgrade, not a
      # suppression file.
      - name: Audit
        run: bun audit --audit-level=moderate

      - name: Verify reviewed image-decoder versions
        run: bun run --cwd apps/media-worker verify:runtime

      - name: Run adversarial image fixtures with a deadline
        run: timeout 30s bunx vitest --run apps/media-worker/src/sanitize-image.test.ts

      - name: Build isolated media image
        run: docker build -f infra/media-worker.Dockerfile -t codevault-media-worker:ci .

      - name: Build API and worker images
        run: |
          docker build -f infra/server.Dockerfile -t codevault-server:ci .
          docker build -f infra/worker.Dockerfile -t codevault-worker:ci .

      - name: Verify isolated media image identity and native runtime
        run: |
          test "$(docker image inspect codevault-media-worker:ci --format '{{.Config.User}}')" = "10002:10002"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 32 --memory 256m --cpus 1 --entrypoint node codevault-media-worker:ci \
            -e 'import("sharp").then((m) => { if (m.default.versions.sharp !== "0.35.3" || m.default.versions.vips !== "8.18.3" || process.getuid() !== 10002 || process.env.VIPS_BLOCK_UNTRUSTED !== "1") process.exit(1); })'

      - name: Refuse broad media credentials
        run: |
          if docker run --rm \
            -e DATABASE_URL=postgres://broad \
            -e S3_ENDPOINT=https://storage.invalid \
            -e S3_BUCKET=test \
            -e S3_ACCESS_KEY_ID=broad \
            -e S3_SECRET_ACCESS_KEY=broad \
            codevault-media-worker:ci >"$RUNNER_TEMP/media-credential-check.log" 2>&1; then
            echo "media worker accepted broad credentials"
            exit 1
          fi
          grep -q "Required media-worker setting MEDIA_DATABASE_URL is missing" "$RUNNER_TEMP/media-credential-check.log"
