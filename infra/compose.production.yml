name: codevault-production

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: codevault_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: codevault
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets: [postgres_admin_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevault_admin -d codevault"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    networks: [data-backend, media-backend]

  database-roles:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_admin_password)"
        psql -h postgres -U codevault_admin -d codevault \
          -v migrator_password="$$(cat /run/secrets/database_migrator_password)" \
          -v app_password="$$(cat /run/secrets/database_app_password)" \
          -v media_password="$$(cat /run/secrets/media_database_password)" \
          -f /provision/020-production-roles.sql
    secrets:
      - postgres_admin_password
      - database_migrator_password
      - database_app_password
      - media_database_password
    volumes:
      - ./postgres-init/020-production-roles.sql:/provision/020-production-roles.sql:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1770
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks: [data-backend]

  database-migrate:
    image: ${CODEVAULT_SERVER_IMAGE:?Set CODEVAULT_SERVER_IMAGE to a signed image digest}
    pull_policy: always
    depends_on:
      database-roles:
        condition: service_completed_successfully
    command: [node, dist/migrate.js]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_migrator_url
    secrets: [database_migrator_url]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1770
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks: [data-backend]

  database-grants:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_admin_password)"
        psql -h postgres -U codevault_admin -d codevault \
          -f /provision/021-production-grants.sql
    secrets: [postgres_admin_password]
    volumes:
      - ./postgres-init/021-production-grants.sql:/provision/021-production-grants.sql:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1770
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks: [data-backend]

  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: [minio_root_user, minio_root_password]
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: ${OBJECTSTORE_MEMORY_LIMIT:-1g}
    cpus: ${OBJECTSTORE_CPU_LIMIT:-1.0}
    networks: [data-backend, media-backend]

  objectstore-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        mc alias set local http://objectstore:9000 \
          "$$(cat /run/secrets/minio_root_user)" \
          "$$(cat /run/secrets/minio_root_password)"
        mc mb --ignore-existing local/codevault-artifacts
        mc anonymous set none local/codevault-artifacts
        mc admin user add local \
          "$$(cat /run/secrets/s3_access_key_id)" \
          "$$(cat /run/secrets/s3_secret_access_key)"
        mc admin policy create local codevault-server /policies/server-s3-policy.json
        mc admin policy attach local codevault-server \
          --user "$$(cat /run/secrets/s3_access_key_id)"
        mc admin user add local \
          "$$(cat /run/secrets/media_s3_access_key_id)" \
          "$$(cat /run/secrets/media_s3_secret_access_key)"
        mc admin policy create local codevault-media /policies/media-worker-s3-policy.json
        mc admin policy attach local codevault-media \
          --user "$$(cat /run/secrets/media_s3_access_key_id)"
    secrets:
      - minio_root_user
      - minio_root_password
      - s3_access_key_id
      - s3_secret_access_key
      - media_s3_access_key_id
      - media_s3_secret_access_key
    volumes:
      - ./server-s3-policy.json:/policies/server-s3-policy.json:ro
      - ./media-worker-s3-policy.json:/policies/media-worker-s3-policy.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1770
      - /root/.mc:size=8m,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks: [data-backend]

  objectstore-cleanup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: unless-stopped
    depends_on:
      objectstore-init:
        condition: service_completed_successfully
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        mc alias set local http://objectstore:9000 \
          "$$(cat /run/secrets/s3_access_key_id)" \
          "$$(cat /run/secrets/s3_secret_access_key)"
        while true; do
          mc rm --incomplete --recursive --older-than 24h --force \
            local/codevault-artifacts
          sleep 3600
        done
    secrets: [s3_access_key_id, s3_secret_access_key]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1770
      - /root/.mc:size=8m,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
    networks: [data-backend]

  server:
    image: ${CODEVAULT_SERVER_IMAGE:?Set CODEVAULT_SERVER_IMAGE to a signed image digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      database-grants:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: "false"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4310
      SERVER_CORS_ORIGINS: ${SERVER_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MFA_ENCRYPTION_KEYS_FILE: /run/secrets/mfa_encryption_keys
      S3_ENDPOINT: http://objectstore:9000
      S3_REGION: us-east-1
      S3_BUCKET: codevault-artifacts
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_FORCE_PATH_STYLE: "true"
    secrets:
      - database_url
      - mfa_encryption_keys
      - s3_access_key_id
      - s3_secret_access_key
    ports:
      - 127.0.0.1:${CODEVAULT_PORT:-4310}:4310
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: ${SERVER_MEMORY_LIMIT:-1g}
    cpus: ${SERVER_CPU_LIMIT:-1.0}
    networks: [data-backend, ingress]

  worker:
    image: ${CODEVAULT_WORKER_IMAGE:?Set CODEVAULT_WORKER_IMAGE to a signed image digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: "false"
      MFA_ENCRYPTION_KEYS_FILE: /run/secrets/mfa_encryption_keys
      S3_ENDPOINT: http://objectstore:9000
      S3_REGION: us-east-1
      S3_BUCKET: codevault-artifacts
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_FORCE_PATH_STYLE: "true"
    secrets:
      - database_url
      - mfa_encryption_keys
      - s3_access_key_id
      - s3_secret_access_key
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1770
      - /home/codevault:size=128m,mode=0700,uid=10001,gid=10001
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    networks: [data-backend]

  media-worker:
    image: ${CODEVAULT_MEDIA_WORKER_IMAGE:?Set CODEVAULT_MEDIA_WORKER_IMAGE to a signed image digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      database-grants:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MEDIA_DATABASE_URL_FILE: /run/secrets/media_database_url
      DATABASE_SSL: "false"
      S3_ENDPOINT: http://objectstore:9000
      S3_REGION: us-east-1
      S3_BUCKET: codevault-artifacts
      MEDIA_S3_ACCESS_KEY_ID_FILE: /run/secrets/media_s3_access_key_id
      MEDIA_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/media_s3_secret_access_key
      S3_FORCE_PATH_STYLE: "true"
    secrets:
      - media_database_url
      - media_s3_access_key_id
      - media_s3_secret_access_key
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: ${MEDIA_WORKER_MEMORY_LIMIT:-256m}
    cpus: ${MEDIA_WORKER_CPU_LIMIT:-1.0}
    networks: [media-backend]

volumes:
  postgres-data:
  objectstore-data:

networks:
  data-backend:
    internal: true
  media-backend:
    internal: true
  ingress:

secrets:
  postgres_admin_password:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/postgres_admin_password
  database_migrator_password:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/database_migrator_password
  database_app_password:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/database_app_password
  media_database_password:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/media_database_password
  database_migrator_url:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/database_migrator_url
  database_url:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/database_url
  media_database_url:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/media_database_url
  mfa_encryption_keys:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/mfa_encryption_keys
  minio_root_user:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/minio_root_user
  minio_root_password:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/minio_root_password
  s3_access_key_id:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/s3_access_key_id
  s3_secret_access_key:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/s3_secret_access_key
  media_s3_access_key_id:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/media_s3_access_key_id
  media_s3_secret_access_key:
    file: ${CODEVAULT_SECRETS_DIR:?Set CODEVAULT_SECRETS_DIR}/media_s3_secret_access_key
