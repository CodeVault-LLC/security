# CodeVault development infrastructure.
#
# Background jobs live in PostgreSQL through pg-boss and large artifacts live
# in object storage, so there is no Redis, message broker, or search cluster.
# One-shot init and maintenance containers enforce least-privilege credentials
# and stale multipart cleanup for this development stack.

# The project name is deliberately distinct so this stack cannot collide with
# another Compose project on the same workstation.
name: codevault-security

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: codevault
      POSTGRES_PASSWORD: codevault_dev_password
      POSTGRES_DB: codevault
      # Development only. Production deployments use scram-sha-256 with TLS.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images expect the mount one level above PGDATA so that a
      # future major-version upgrade can use `pg_upgrade --link`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevault -d codevault"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [media-backend, host-access]

  # Runs on every stack start, including upgrades with an existing data volume.
  # The SQL is idempotent and provisions only development credentials.
  media-db-init:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: codevault_dev_password
    command:
      - psql
      - postgres://codevault@postgres:5432/codevault
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /init/010-media-runtime.sql
    volumes:
      - ./postgres-init/010-media-runtime.sql:/init/010-media-runtime.sql:ro
    networks: [media-backend]

  # Ephemeral release-test database. It starts only with
  # `docker compose --profile e2e up postgres-e2e` and never shares the
  # development volume, so destructive acceptance fixtures are disposable.
  postgres-e2e:
    profiles: ["e2e"]
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: codevault
      POSTGRES_PASSWORD: codevault_e2e_password
      POSTGRES_DB: codevault_e2e
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevault -d codevault_e2e"]
      interval: 2s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for artifacts. Buckets are private; the API
  # hands out short-lived presigned URLs and never proxies file bytes.
  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codevault
      MINIO_ROOT_PASSWORD: codevault_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [media-backend, host-access]

  objectstore-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://objectstore:9000 codevault codevault_dev_password &&
      mc mb --ignore-existing local/codevault-artifacts &&
      mc anonymous set none local/codevault-artifacts &&
      (mc admin user info local codevault-media >/dev/null 2>&1 || mc admin user add local codevault-media codevault_media_dev_password) &&
      (mc admin policy info local codevault-media-runtime >/dev/null 2>&1 || mc admin policy create local codevault-media-runtime /policies/media-worker-s3-policy.json) &&
      mc admin policy attach local codevault-media-runtime --user codevault-media
      "
    volumes:
      - ./media-worker-s3-policy.json:/policies/media-worker-s3-policy.json:ro
    networks: [media-backend]

  # The pinned development MinIO release does not expose an abort-only ILM
  # rule, so stale multipart data is removed by a narrow maintenance process.
  # Production S3 deployments should use AbortIncompleteMultipartUpload ILM.
  objectstore-cleanup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: unless-stopped
    depends_on:
      objectstore-init:
        condition: service_completed_successfully
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://objectstore:9000 codevault codevault_dev_password &&
      while true; do
        mc rm --incomplete --recursive --older-than 24h --force local/codevault-artifacts;
        sleep 3600;
      done
      "
    environment:
      MC_CONFIG_DIR: /tmp/mc
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1770
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
    networks: [media-backend]

  media-worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/media-worker.Dockerfile
    restart: unless-stopped
    depends_on:
      media-db-init:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    environment:
      MEDIA_DATABASE_URL: postgres://codevault_media_login:codevault_media_dev_password@postgres:5432/codevault
      S3_ENDPOINT: http://objectstore:9000
      S3_REGION: us-east-1
      S3_BUCKET: codevault-artifacts
      MEDIA_S3_ACCESS_KEY_ID: codevault-media
      MEDIA_S3_SECRET_ACCESS_KEY: codevault_media_dev_password
      S3_FORCE_PATH_STYLE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: 1.0
    networks: [media-backend]

volumes:
  postgres-data:
  objectstore-data:

networks:
  media-backend:
    internal: true
  host-access:
