# CodeVault development infrastructure.
#
# Two services only. Background jobs live in PostgreSQL through pg-boss and
# large artifacts live in object storage, so there is no Redis, no message
# broker and no search cluster to operate.

# The project name is deliberately distinct so this stack cannot collide with
# another Compose project on the same workstation.
name: codevault-security

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codevault
      POSTGRES_PASSWORD: codevault_dev_password
      POSTGRES_DB: codevault
      # Development only. Production deployments use scram-sha-256 with TLS.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images expect the mount one level above PGDATA so that a
      # future major-version upgrade can use `pg_upgrade --link`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevault -d codevault"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [media-backend]

  # S3-compatible object storage for artifacts. Buckets are private; the API
  # hands out short-lived presigned URLs and never proxies file bytes.
  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codevault
      MINIO_ROOT_PASSWORD: codevault_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [media-backend]

  objectstore-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://objectstore:9000 codevault codevault_dev_password &&
      mc mb --ignore-existing local/codevault-artifacts &&
      mc anonymous set none local/codevault-artifacts
      "
    networks: [media-backend]

  media-worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/media-worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    environment:
      MEDIA_DATABASE_URL: postgres://codevault:codevault_dev_password@postgres:5432/codevault
      S3_ENDPOINT: http://objectstore:9000
      S3_REGION: us-east-1
      S3_BUCKET: codevault-artifacts
      MEDIA_S3_ACCESS_KEY_ID: codevault
      MEDIA_S3_SECRET_ACCESS_KEY: codevault_dev_password
      S3_FORCE_PATH_STYLE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: 1.0
    networks: [media-backend]

volumes:
  postgres-data:
  objectstore-data:

networks:
  media-backend:
    internal: true
