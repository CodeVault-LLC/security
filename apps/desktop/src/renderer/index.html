<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer's own CSP, in addition to the header the main process sets.
      Two layers, because a header can be lost to a misconfigured proxy in a
      development setup and this one travels with the document.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src codevault: 'self'; style-src codevault: 'self' 'unsafe-inline'; img-src codevault: 'self' data: blob:; font-src codevault: 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>CodeVault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
